<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Clock & Weather</title>
  
  <!-- Keep-Silk-Open Script -->
  <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>
  <script>var AlwaysUseSilk = true;</script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      cursor: pointer;
      user-select: none;
    }
    #time {
      font-size: 22vw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
    }
    #sub-info {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-top: 1.5rem;
    }
    #date, #weather {
      font-size: 3.5vw;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #weather {
      color: #4da6ff; /* Soft blue highlight for weather */
    }
  </style>
</head>
<body>

  <div id="time">12:00 PM</div>
  <div id="sub-info">
    <div id="date">Loading date...</div>
    <div id="weather">Loading weather...</div>
  </div>

  <script>
    // 1. Update 12-Hour Clock & Date
    function updateClock() {
      const now = new Date();
      
      // 12-hour format without seconds (e.g. "3:45 PM")
      const timeStr = now.toLocaleTimeString([], { 
        hour: 'numeric', 
        minute: '2-digit', 
        hour12: true 
      });
      
      // Full date format (e.g. "Thursday, August 6")
      const dateStr = now.toLocaleDateString([], { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric' 
      });
      
      document.getElementById('time').innerText = timeStr;
      document.getElementById('date').innerText = dateStr;
    }

    // 2. Fetch Live Weather via Open-Meteo API (Free, No API Key Required)
    function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          const condition = getWeatherCondition(code);
          document.getElementById('weather').innerText = `${temp}°F • ${condition}`;
        })
        .catch(() => {
          document.getElementById('weather').innerText = 'Weather unavailable';
        });
    }

    // Map WMO Weather Codes to text
    function getWeatherCondition(code) {
      if (code === 0) return 'Clear';
      if (code <= 3) return 'Partly Cloudy';
      if (code <= 48) return 'Foggy';
      if (code <= 67) return 'Rain';
      if (code <= 77) return 'Snow';
      if (code <= 82) return 'Showers';
      if (code <= 99) return 'Thunderstorm';
      return 'Cloudy';
    }

    // Request device geolocation for accurate local weather
    function initWeather() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
          () => { document.getElementById('weather').innerText = 'Location access denied'; }
        );
      } else {
        document.getElementById('weather').innerText = '';
      }
    }

    // Initial calls & intervals
    setInterval(updateClock, 1000);
    updateClock();

    // Fetch weather immediately and refresh every 15 minutes
    initWeather();
    setInterval(initWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
